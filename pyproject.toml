    
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-mcp-assistant"
version = "0.1.0"
description = "Permission-aware LinkedIn MCP assistant"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "pydantic>=2,<3",
    "httpx>=0.27",
    "python-dotenv>=1,<2",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "keyring>=25.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
